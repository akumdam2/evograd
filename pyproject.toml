[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evograd"
version = "0.1.0"
description = "Evolved backward kernels: generate autograd-pair seeds from a forward reference via multiple pipelines, then optimize them with OpenEvolve."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml",
    "torch",
    "openevolve>=0.3.2,<0.4",
]

[project.optional-dependencies]
gpu = ["triton"]
llm = ["openai"]
dev = ["black", "pytest>=7"]
baselines = ["liger-kernel"]
# Level-4 model workloads. Qwen3 arrived in transformers 4.51.0;
# the milestone was developed and measured against 5.16.1. Llama predates
# that, but 4.51 is the floor the rest of the harness targets.
qwen3 = ["transformers>=4.51"]
llama3 = ["transformers>=4.51"]
workloads = ["transformers>=4.51"]
vision_workloads = ["transformers>=4.57,<4.58", "pillow"]
# The alphafold3 training-step workload, which the MegaFold one replaced as the
# registered Level-4 task. alphafold3-pytorch is the implementation MegaFold
# builds on; the declaration and its adapters are still in the tree, so the
# extra stays.
af3 = ["alphafold3-pytorch>=0.8.3,<0.9"]
# There is deliberately no `megafold` extra. MegaFold is a source checkout, not
# a distribution: it ships no setup.py and no pyproject.toml, so there is
# nothing for pip to resolve and no version to pin. The Level-4 workload finds
# it on PYTHONPATH instead:
#
#     git clone https://github.com/Supercomputing-System-AI-Lab/MegaFold
#     PYTHONPATH=/path/to/MegaFold:src python -m evograd.evaluation.tier3.cli \
#         --model megafold_2l --residues 128
#
# Without it the megafold workload reports as uncovered, which is the same
# thing every unmet `requires` does.

[project.scripts]
evograd = "evograd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evograd = ["evolve/*.yaml", "benchmark/topdown/*/harvest/*.json", "benchmark/topdown/*/*.json"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
# `tests` is a real package (tests/__init__.py) so the cross-module fixture
# imports (`from tests._registry_fixture import ...`) resolve to this repo.
# Without the repo root ahead of site-packages, an unrelated installed
# top-level `tests` package shadows it and collection fails.
pythonpath = [".", "src"]
testpaths = ["tests"]
