# OpenEvolve config template for evograd autograd-pair evolution.
# Rendered by evograd.evolve.run with the operator's contract; ported from the
# old repo's config_autograd_pair_speed_memory.yaml.
max_iterations: __MAX_ITERATIONS__
checkpoint_interval: 5
log_level: "INFO"
max_tasks_per_child: 1

llm:
  # OpenEvolve >=0.2.27 model-list API. The old primary_model / secondary_model
  # compatibility fields are intentionally not used.
  models:
    - name: "__PRIMARY_MODEL__"
      weight: 0.8
    - name: "__SECONDARY_MODEL__"
      weight: 0.2
  api_base: "__API_BASE__"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.5
  max_tokens: 16000
  timeout: 180

prompt:
  system_message: |
    You are an expert Triton GPU programmer optimizing an autograd-pair kernel.

    Task:
    Improve the code inside the EVOLVE-BLOCK. The public API is a flexible
    forward/backward pair:

        def __FORWARD_FN__(__FORWARD_ARGS__):
            return y, saved_tensors

        def __BACKWARD_FN__(__BACKWARD_ARGS__):
            return __BACKWARD_RETURNS__

    You may modify which tensors the forward saves, as long as backward consumes
    the same saved_tensors contract and correctness is preserved.

    Operator semantics:
    - __FORWARD_SEMANTICS__
    - __BACKWARD_SEMANTICS__
    - Activity: __ACTIVITY_CONTRACT__ (Inactive inputs never receive gradients).
    - Additional constraints: __EXTRA_CONSTRAINTS__

    The evaluator is memory-aware:
    - It measures backward_from_saved latency.
    - It measures forward+backward full-step latency.
    - It reports saved_memory_ratio = saved_bytes / input_bytes.
    - The combined score uses a weighted speedup with a small penalty for saved
      tensor memory.

    Saved tensor policy:
    - Prefer compact saved state such as per-row/per-block statistics over full
      activation-sized tensors when the backward can cheaply reconstruct the
      larger intermediate.
    - Avoid saving tensors with the same shape as a large activation unless the
      latency benefit clearly outweighs the memory cost.
    - Saved tensors are part of the optimization tradeoff, not free inputs.

    Correctness is a hard requirement. Support the benchmark's CUDA dtypes,
    preserve output dtypes, and use fp32 accumulation for reductions. Do not
    call PyTorch autograd in generated math.

database:
  population_size: 30
  archive_size: __ARCHIVE_SIZE__
  num_islands: __NUM_ISLANDS__
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.75
  similarity_threshold: 0.99
  # MAP-Elites grid axes. Built-ins (complexity/diversity/score) are computed
  # by OpenEvolve; custom names are evaluator metrics guaranteed on every
  # result path (see evolve.scoring.CUSTOM_FEATURE_DIMENSION_DEFAULTS).
  feature_dimensions: __FEATURE_DIMENSIONS__
  feature_bins: __FEATURE_BINS__

evaluator:
  # The killable evograd child times out at 850s. Keep OpenEvolve's outer
  # timeout above it so the inner process can destroy a deadlocked CUDA context.
  timeout: 900
  parallel_evaluations: 1
  cascade_evaluation: false

diff_based_evolution: true
# A safety limit on runaway generation, not a style budget. Inductor-captured
# seeds (Pipeline D) carry generated kernels and already reach ~66k characters
# on evoattention, and a child that adds its own kernels grows from there.
max_code_length: 120000
